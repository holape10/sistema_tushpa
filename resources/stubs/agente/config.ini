; ============================================================
;  AGENTE DE IMPRESION - CONFIGURACION
; ============================================================
; Cada bloque [ ... ] es un sistema que esta PC imprime.
; Para agregar otra empresa o sucursal: en el sistema entra a Impresoras > "Solo la clave"
; y pega aqui el bloque que se descarga. No hace falta reiniciar el agente.

[AGENTE]
; segundos entre cada revision
intervalo = 2
; ruta de SumatraPDF para imprimir A4 (por defecto, el que esta en esta misma carpeta)
; sumatra = "C:\sistema\sumatrapdf.exe"
; 1 = verificar el certificado https (requiere cacert en el PHP de esta PC)
verificar_ssl = 0

